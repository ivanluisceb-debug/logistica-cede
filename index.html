<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logística CEDE</title>
<meta name="description" content="Pedidos de materiales y seguimiento del camión · CEDE srl">
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logística CEDE">
<style>
  html, body { margin: 0; height: 100%; background: #1e293b; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block;
         padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #f1f5f9; }
  #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 18px; background: #1e293b; color: #cbd5e1; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           transition: opacity .3s; z-index: 2; text-align: center; padding: 24px; }
  #carga img { width: 120px; height: 120px; border-radius: 26px; }
  #carga.fuera { opacity: 0; pointer-events: none; }
  .spin { width: 28px; height: 28px; border: 3px solid #334155; border-top-color: #60a5fa; border-radius: 50%; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  #carga button { margin-top: 6px; border: 0; border-radius: 999px; padding: 10px 18px; font: 600 14px system-ui, sans-serif;
                  background: #2563eb; color: #fff; cursor: pointer; display: none; }
  /* Barra para permitir los avisos del celular (el permiso tiene que pedirse con un toque en esta página) */
  #permiso { position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 5; display: none;
             align-items: center; gap: 10px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 14px;
             padding: 12px 14px; font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
             box-shadow: 0 14px 40px rgba(0,0,0,.4); max-width: 520px; margin: 0 auto; }
  #permiso.on { display: flex; }
  #permiso span { flex: 1; }
  #permiso button { border: 0; border-radius: 999px; padding: 9px 14px; font: 600 13px system-ui, sans-serif; cursor: pointer; white-space: nowrap; }
  #permSi { background: #2563eb; color: #fff; }
  #permNo { background: transparent; color: #94a3b8; }
</style>
</head>
<body>
<div id="carga">
  <img src="icon-192.png" alt="">
  <div class="spin" id="spin"></div>
  <div id="msg">Cargando…</div>
  <button id="reintentar" onclick="location.reload()">Reintentar</button>
</div>
<iframe id="app" title="Logística CEDE" allow="geolocation; clipboard-write"></iframe>
<div id="permiso" role="dialog" aria-label="Avisos del celular">
  <span>🔔 ¿Permitir que el celular te avise cuando se entrega un pedido?</span>
  <button id="permNo">Ahora no</button><button id="permSi">Permitir</button>
</div>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbxFTtcrDLYH3lxPtExA74zRp1SQcDk-3OTkfqQFvuthexKGslo35Az7nXEMNauCgk5mjQ/exec';
  // Ya instalada: se lo avisa a la app para que oculte los botones de "Instalar"
  var instalada = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  document.getElementById('app').src = APP + (instalada ? '?pwa=1' : '');

  /* ---------- Mensajes con la app (que corre adentro, en Google) ---------- */
  var diferido = null, fuenteApp = null;
  var soporta = 'Notification' in window && 'serviceWorker' in navigator;
  function estadoPermiso() { return soporta ? Notification.permission : 'no-soportado'; }
  function responder(msg) { try { fuenteApp && fuenteApp.postMessage(msg, '*'); } catch (x) {} }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); diferido = e; });
  window.addEventListener('appinstalled', function () { diferido = null; });
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.cede) return;
    try { if (!/\.(googleusercontent|google)\.com$/.test(new URL(e.origin).hostname)) return; } catch (x) { return; }
    fuenteApp = e.source;
    // Botón "Instalar en Android": si Chrome ofrece instalar, se abre el cartel directamente
    if (d.cede === 'instalar') {
      if (d.so === 'android' && diferido) {
        responder({ cede: 'ok' });
        diferido.prompt();
        diferido.userChoice.then(function () { diferido = null; });
      }
      return; // si no se puede (iPhone, ya instalada, otro navegador), la app muestra los pasos
    }
    // La app pregunta si puede usar los avisos del celular
    if (d.cede === 'hola') { responder({ cede: 'permiso', estado: estadoPermiso() }); return; }
    // La app pide activar los avisos: se muestra la barra para que la persona toque "Permitir"
    if (d.cede === 'pedir-permiso') {
      if (estadoPermiso() === 'default') document.getElementById('permiso').classList.add('on');
      else responder({ cede: 'permiso', estado: estadoPermiso() });
      return;
    }
    // Pedido entregado: notificación del celular si la app no está a la vista
    if (d.cede === 'notif') {
      if (estadoPermiso() !== 'granted' || !document.hidden) return;
      navigator.serviceWorker.ready.then(function (r) {
        return r.showNotification(String(d.titulo || 'Logística CEDE'), {
          body: String(d.texto || ''), icon: 'icon-192.png', badge: 'icon-192.png', tag: String(d.tag || 'cede'), renotify: true
        });
      }).catch(function () {});
    }
  });
  document.getElementById('permSi').onclick = function () {
    document.getElementById('permiso').classList.remove('on');
    Notification.requestPermission().then(function () { responder({ cede: 'permiso', estado: estadoPermiso() }); });
  };
  document.getElementById('permNo').onclick = function () {
    document.getElementById('permiso').classList.remove('on');
    responder({ cede: 'permiso', estado: estadoPermiso() });
  };

  /* ---------- Pantalla de carga / sin conexión ---------- */
  var carga = document.getElementById('carga'), listo = false;
  document.getElementById('app').addEventListener('load', function () {
    listo = true; carga.classList.add('fuera');
  });
  function sinConexion() {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').textContent = 'Sin conexión a internet. Revisá los datos o el wifi.';
    document.getElementById('reintentar').style.display = 'inline-block';
    carga.classList.remove('fuera');
  }
  if (!navigator.onLine) sinConexion();
  window.addEventListener('offline', sinConexion);
  window.addEventListener('online', function () { if (!listo) location.reload(); else carga.classList.add('fuera'); });
  setTimeout(function () { if (!listo) document.getElementById('msg').textContent = 'Está tardando más de lo normal…'; }, 12000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
